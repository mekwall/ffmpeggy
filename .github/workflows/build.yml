name: build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
      os:
        required: true
        type: string
      debug:
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: build
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn typecheck

      - name: Build
        run: yarn build
        env:
          DEBUG: ${{ inputs.debug && '*' || '' }}

      - name: Check package
        run: yarn check:package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/
            package.json
            yarn.lock
          retention-days: 7
