name: pr

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "yarn.lock"
      - "tsconfig*.json"
      - "biome.json"
      - "vitest.config.ts"
      - "mise.toml"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "!**/*.md"

permissions:
  contents: read
  checks: write
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      os: "ubuntu-latest"
      debug: false

  test:
    uses: ./.github/workflows/test.yml
    needs: build
    with:
      node-version: ${{ matrix.node-version }}
      os: ${{ matrix.os }}
      debug: false
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version: ["22", "24"]

  coverage:
    uses: ./.github/workflows/coverage.yml
    needs: build
    with:
      node-version: "24"
      os: "ubuntu-latest"
      debug: false

  lint:
    uses: ./.github/workflows/lint.yml
    with:
      os: "ubuntu-latest"
