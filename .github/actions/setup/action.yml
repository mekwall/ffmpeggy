name: "Setup"
description: "Install the toolchain from mise.toml and restore the Yarn cache"

inputs:
  node-version:
    description: "Node.js version to use instead of the one in mise.toml"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Override Node.js version
      if: inputs.node-version != ''
      shell: bash
      run: echo "MISE_NODE_VERSION=${{ inputs.node-version }}" >> "$GITHUB_ENV"

    - name: Install toolchain
      uses: jdx/mise-action@v4

    - name: Cache Yarn packages
      uses: actions/cache@v4
      with:
        path: .yarn/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          yarn-${{ runner.os }}-
